name: Hourly Subscription Maintenance Cron

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  subscription-check:
    runs-on: ubuntu-latest

    steps:
      - name: Validate CRON_SECRET
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "ERROR: CRON_SECRET GitHub Actions repository secret is not configured."
            exit 1
          fi

      - name: Trigger Subscription Check Endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -f -sS -X GET "https://touchqr.in/api/cron/subscription-check" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json"

