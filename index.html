<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TouchQR - Smart QR Ordering for Restaurants, Hotels, Cinemas & Bakeries</title>
    <meta name="description" content="All-in-one Smart QR Ordering & Digital Catalog Platform. Manage Dine-in Tables, Hotel Room Service, Cinema Seats, Takeaway Counters & WhatsApp Orders." />
    
    <!-- OpenGraph & Social Sharing Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TouchQR - Smart QR Ordering for Restaurants, Hotels, Cinemas & Bakeries" />
    <meta property="og:description" content="All-in-one Smart QR Ordering & Digital Catalog Platform for Restaurants, Hotels, Cinemas, Bakeries, and Food Courts." />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Google Fonts -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#064E3B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      (function () {
        try {
          var p = window.location.pathname || '/';
          var m = p.match(/^\/([^\/?#]+)/);
          var seg = m ? m[1].toLowerCase() : '';
          var sys = { '': 1, admin: 1, superadmin: 1, 'super-admin': 1, register: 1, billing: 1, kitchen: 1, 'privacy-policy': 1, privacy: 1, terms: 1, 'terms-of-service': 1, 'refund-policy': 1, refunds: 1, security: 1, contact: 1, support: 1 };
          var key = (seg && !sys[seg]) ? seg : (window.location.hostname || '').toLowerCase();
          if (key) {
            var cachedTheme = window.localStorage.getItem('touchqr_theme_' + key);
            if (cachedTheme) {
              document.documentElement.setAttribute('data-theme', cachedTheme);
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
